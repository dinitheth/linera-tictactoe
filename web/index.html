<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linera Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Linera Tic-Tac-Toe</h1>
        
        <div id="connection-panel">
            <h2>Connect to Wallet</h2>
            <div class="form-group">
                <input type="text" id="wallet-url" placeholder="Wallet URL" value="http://localhost:8080">
                <button id="connect-wallet">Connect Wallet</button>
            </div>
        </div>
        
        <div id="game-panel" style="display: none;">
            <div class="game-actions">
                <button id="create-game">Create New Game</button>
                <div class="game-list-container">
                    <h3>Available Games</h3>
                    <div id="game-list" class="game-list"></div>
                </div>
            </div>
            
            <div id="active-game" style="display: none;">
                <h3>Game #<span id="game-id"></span></h3>
                <div id="game-status" class="game-status"></div>
                
                <div class="board-container">
                    <div id="game-board" class="game-board">
                        <!-- Board cells will be generated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
